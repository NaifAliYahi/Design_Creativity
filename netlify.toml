# Netlify deploy - customer design page at /design
# https://app.netlify.com -> Import from Git -> mahfazat-jeeb-design

[build]
  command = "npm run build:netlify"
  publish = "dist"

# SPA: serve index.html for all routes (fixes refresh on /design)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
